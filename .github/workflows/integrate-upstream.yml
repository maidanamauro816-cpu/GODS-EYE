name: Integrate God's Eye View upstream

on:
  push:
    branches: [feature/gods-eye-view-integration]
    paths: ['.github/workflows/integrate-upstream.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: write

concurrency:
  group: gods-eye-upstream-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: feature/gods-eye-view-integration
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node 24.14.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download upstream source
        run: git clone --depth 1 https://github.com/bilawalsidhu/gods-eye-view.git /tmp/gods-eye-view

      - name: Integrate upstream application
        run: node scripts/integrate-upstream.mjs
        env:
          GEV_UPSTREAM_DIR: /tmp/gods-eye-view

      - name: Install merged dependencies
        run: npm install --no-audit --no-fund

      - name: Verify browser build
        run: npm run build

      - name: Verify Vercel provider middleware initializes
        run: |
          node --input-type=module -e "import { createServer } from 'vite'; const s = await createServer({ configFile: 'server/standalone/vite.config.js', appType: 'custom', server: { middlewareMode: true, hmr: false, watch: null }, optimizeDeps: { noDiscovery: true, include: [] } }); console.log('Provider middleware stack:', s.middlewares.stack.length); if (!s.middlewares.stack.length) process.exit(1); await s.close();"

      - name: Build Android application
        run: |
          node scripts/prepare-icon.mjs
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: el-ojo-de-dios-integrated-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Commit integrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Upstream source is already synchronized."
            exit 0
          fi
          git commit -m "Integrate upstream God's Eye View application and providers [skip ci]"
          git push origin HEAD:feature/gods-eye-view-integration
