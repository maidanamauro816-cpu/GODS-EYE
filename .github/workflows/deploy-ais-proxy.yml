name: Deploy GOD'S EYE AIS proxy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate deployment secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AIS_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: |
          test -n "$CF_TOKEN" || (echo 'Falta CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CF_ACCOUNT" || (echo 'Falta CLOUDFLARE_ACCOUNT_ID' && exit 1)
          test -n "$AIS_KEY" || (echo 'Falta AISSTREAM_API_KEY' && exit 1)
      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config workers/ais-proxy/wrangler.toml
      - name: Set AIS credentials on Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          ALLOWED_ORIGINS: ${{ secrets.AIS_ALLOWED_ORIGINS }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        run: |
          printf '%s' "$AISSTREAM_API_KEY" | npx --yes wrangler@4 secret put AISSTREAM_API_KEY --config workers/ais-proxy/wrangler.toml
          if [ -n "$ALLOWED_ORIGINS" ]; then
            printf '%s' "$ALLOWED_ORIGINS" | npx --yes wrangler@4 secret put ALLOWED_ORIGINS --config workers/ais-proxy/wrangler.toml
          fi
          if [ -n "$FIRMS_MAP_KEY" ]; then
            printf '%s' "$FIRMS_MAP_KEY" | npx --yes wrangler@4 secret put FIRMS_MAP_KEY --config workers/ais-proxy/wrangler.toml
          fi
          if [ -n "$OPENSKY_CLIENT_ID" ]; then
            printf '%s' "$OPENSKY_CLIENT_ID" | npx --yes wrangler@4 secret put OPENSKY_CLIENT_ID --config workers/ais-proxy/wrangler.toml
          fi
          if [ -n "$OPENSKY_CLIENT_SECRET" ]; then
            printf '%s' "$OPENSKY_CLIENT_SECRET" | npx --yes wrangler@4 secret put OPENSKY_CLIENT_SECRET --config workers/ais-proxy/wrangler.toml
          fi
